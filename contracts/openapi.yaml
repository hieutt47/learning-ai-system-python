{
  "openapi": "3.1.0",
  "info": {"title": "Learning AI Python API", "version": "0.1.0", "description": "Partial canonical contract: minimal identity, categories, draft course management and lessons. Marketplace, publication, enrollment and quiz learning are not yet implemented. JSON syntax is valid YAML 1.2. IDs and prices are strings; UTC timestamps end in Z. Other product operations are not implemented. Refresh/logout omit Authorization; valid unexpired inactive-user Bearer blocks them with 403 before mutation. Validation errors are 400. Access JWT remains usable until exp after logout while user active."},
  "paths": {
    "/api/v1/auth/login": {"post": {
      "operationId": "login", "security": [],
      "description": "Trim/lowercase email; preserve password; nonblank password at most 72 UTF-8 bytes. Active and email-verified user required.",
      "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Login"}}}},
      "responses": {
        "200": {"$ref": "#/components/responses/Tokens"},
        "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"},
        "403": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}
      }
    }},
    "/api/v1/auth/refresh": {"post": {
      "operationId": "refresh", "security": [{"refreshCookie": []}],
      "description": "No request body or Authorization. Lock session, reject revoked/expired, require active verified user, rotate hash in same row; sliding seven-day lifetime.",
      "responses": {"200": {"$ref": "#/components/responses/Tokens"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}
    }},
    "/api/v1/auth/logout": {"post": {
      "operationId": "logout", "security": [{"refreshCookie": []}, {}],
      "description": "No body or Authorization. Missing/unknown/revoked cookie is successful. Revoke matching session, clear cookie, preserve issued access JWT.",
      "responses": {
        "204": {"description": "No body. Refresh cookie cleared with matching name/path, HttpOnly, SameSite=Lax, Max-Age=0.", "headers": {"Set-Cookie": {"schema": {"type": "string"}}, "X-Request-ID": {"schema": {"type": "string"}}}},
        "403": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}
      }
    }},
    "/api/v1/users/me": {"get": {
      "operationId": "currentUser", "security": [{"bearerAuth": []}],
      "description": "Valid HS256 access JWT with exp/iat/sub; reload user role/active status from database. Never expose password/hash/session data.",
      "responses": {
        "200": {"description": "Current active user", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}},
        "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}
      }
    }},
    "/api/v1/categories": {
      "get": {"operationId": "listCategories", "security": [], "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Public category page, created_at DESC then id DESC", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryPage"}}}}, "400": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}},
      "post": {"operationId": "createCategory", "security": [{"bearerAuth": []}], "description": "ADMIN only. Trim name; reject blank or over 120 characters. Duplicate name returns 409 INVALID_STATE. No Location required.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryCreate"}}}}, "responses": {"201": {"description": "Created category", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/categories/{category_id}": {
      "parameters": [{"name": "category_id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Id"}}],
      "patch": {"operationId": "updateCategory", "security": [{"bearerAuth": []}], "description": "ADMIN only. Omitted/null values retain existing fields. Empty description is a real update.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryPatch"}}}}, "responses": {"200": {"description": "Updated category", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}},
      "delete": {"operationId": "deleteCategory", "security": [{"bearerAuth": []}], "description": "ADMIN only. Referenced category returns 409 RESOURCE_IN_USE; no cascade.", "responses": {"204": {"description": "Deleted; no body"}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/courses": {"post": {"operationId": "createCourse", "security": [{"bearerAuth": []}], "description": "TEACHER/ADMIN creates own draft. Owner, thumbnail and lifecycle are server-owned. Nonnegative draft price may exceed zero.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CourseCreate"}}}}, "responses": {"201": {"description": "Created draft", "headers": {"Location": {"schema": {"type": "string"}, "description": "Owner detail URL /api/v1/teaching/courses/{id}"}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Course"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}},
    "/api/v1/teaching/courses": {"get": {"operationId": "listOwnedCourses", "security": [{"bearerAuth": []}], "description": "TEACHER sees own courses, ADMIN sees all. created_at DESC then id DESC.", "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Authorized course page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CoursePage"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}},
    "/api/v1/teaching/courses/{course_id}": {"parameters": [{"$ref": "#/components/parameters/CourseId"}], "get": {"operationId": "getOwnedCourse", "security": [{"bearerAuth": []}], "description": "Course-owning TEACHER or ADMIN only; never public draft access.", "responses": {"200": {"description": "Authorized course", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Course"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}},
    "/api/v1/courses/{course_id}": {
      "parameters": [{"$ref": "#/components/parameters/CourseId"}],
      "patch": {"operationId": "updateDraftCourse", "security": [{"bearerAuth": []}], "description": "Owner/admin. Omitted/null fields retain existing values; provided title/description cannot be blank. Current scope rejects published/archived writes with 409; this is not a final policy for published edits.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CoursePatch"}}}}, "responses": {"200": {"description": "Updated draft", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Course"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}},
      "delete": {"operationId": "deleteDraftCourse", "security": [{"bearerAuth": []}], "description": "Owner/admin. Only unpublished, unarchived, unused draft. Dependencies or non-draft state return 409 INVALID_STATE. Never cascade history.", "responses": {"204": {"description": "Deleted; no body"}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/courses/{course_id}/lessons": {
      "parameters": [{"$ref": "#/components/parameters/CourseId"}],
      "get": {"operationId": "listLessons", "security": [{"bearerAuth": []}], "description": "Owner/admin or enrolled STUDENT. Raw ordered array for existing frontend compatibility, not a page. Student transcript_text is null even on archived/unpublished courses.", "responses": {"200": {"description": "Authorized lessons ordered by order_index and id", "content": {"application/json": {"schema": {"type": "array", "items": {"$ref": "#/components/schemas/Lesson"}}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}},
      "post": {"operationId": "createLesson", "security": [{"bearerAuth": []}], "description": "Owner/admin only; current scope supports draft course writes. Course row lock serializes allocating the next order index. video_url optional for draft, otherwise validated YouTube URL; no iframe HTML. Transcript is private to managers.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LessonWrite"}}}}, "responses": {"201": {"description": "Created lesson", "headers": {"Location": {"schema": {"type": "string"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Lesson"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/lessons/{lesson_id}": {
      "parameters": [{"name": "lesson_id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Id"}}],
      "get": {"operationId": "getLesson", "security": [{"bearerAuth": []}], "description": "Owner/admin or enrolled STUDENT; student transcript_text always null. No private storage paths or AI provenance fields.", "responses": {"200": {"description": "Authorized lesson", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Lesson"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}},
      "put": {"operationId": "replaceLesson", "security": [{"bearerAuth": []}], "description": "Owner/admin, draft course only. PUT replacement matches the existing React and Java API. Required title; omitted/null video clears to empty string, omitted/null transcript clears to null. This deliberately resolves the older Markdown PATCH discrepancy; reorder/document workflows are deferred.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LessonWrite"}}}}, "responses": {"200": {"description": "Replaced lesson", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Lesson"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}},
      "delete": {"operationId": "deleteLesson", "security": [{"bearerAuth": []}], "description": "Owner/admin only. Reject non-draft or any membership/document/quiz/flashcard/AI dependency with 409 INVALID_STATE, never cascade history/files.", "responses": {"204": {"description": "Deleted; no body"}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/courses/{course_id}/enroll": {
      "parameters": [{"$ref": "#/components/parameters/CourseId"}],
      "post": {"operationId": "enrollCourse", "security": [{"bearerAuth": []}], "description": "STUDENT only. Locks course row in transaction. Returns 201 on first enrollment for published, nonarchived, free course; returns 200 with existing membership on retry even after unpublish/archive.", "responses": {"200": {"description": "Existing membership returned on retry", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Enrollment"}}}}, "201": {"description": "Enrolled", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Enrollment"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/users/me/courses": {
      "get": {"operationId": "listMyCourses", "security": [{"bearerAuth": []}], "description": "STUDENT only. Returns enrolled courses including unpublished/archived courses, ordered by enrolled_at DESC, id DESC.", "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Enrolled course page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CourseEnrollmentPage"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    },
    "/api/v1/courses/{course_id}/members": {
      "parameters": [{"$ref": "#/components/parameters/CourseId"}],
      "get": {"operationId": "listCourseMembers", "security": [{"bearerAuth": []}], "description": "Course-owning TEACHER or ADMIN only. Ordered by enrolled_at DESC, id DESC.", "parameters": [{"$ref": "#/components/parameters/Page"}, {"$ref": "#/components/parameters/PageSize"}], "responses": {"200": {"description": "Course member page", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MemberPage"}}}}, "400": {"$ref": "#/components/responses/Error"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
    }
  },
  "components": {
    "securitySchemes": {"bearerAuth": {"type": "http", "scheme": "bearer", "bearerFormat": "JWT"}, "refreshCookie": {"type": "apiKey", "in": "cookie", "name": "refreshToken"}},
    "parameters": {
      "Page": {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}},
      "PageSize": {"name": "page_size", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 20}},
      "CourseId": {"name": "course_id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Id"}}
    },
    "schemas": {
      "Id": {"type": "string", "pattern": "^[1-9][0-9]{0,18}$", "description": "Positive signed BIGINT decimal string, maximum 9223372036854775807; range additionally validated server-side."},
      "Price": {"type": "string", "pattern": "^[0-9]{1,12}(\\.[0-9]{1,2})?$", "description": "Nonnegative DECIMAL(14,2) as a string, no exponent notation; response has two decimal places."},
      "Category": {"type": "object", "additionalProperties": false, "required": ["id", "name", "description"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "name": {"type": "string", "minLength": 1, "maxLength": 120}, "description": {"type": ["string", "null"]}}},
      "CategoryCreate": {"type": "object", "additionalProperties": false, "required": ["name"], "properties": {"name": {"type": "string", "description": "Nonblank after trim, at most 120 characters after trim."}, "description": {"type": ["string", "null"]}}},
      "CategoryPatch": {"type": "object", "additionalProperties": false, "properties": {"name": {"type": ["string", "null"], "description": "Null means no change; otherwise trimmed and nonblank, at most 120 characters."}, "description": {"type": ["string", "null"], "description": "Null means no change; empty string clears text."}}},
      "CourseCreate": {"type": "object", "additionalProperties": false, "required": ["title", "description", "category_id", "price"], "properties": {"title": {"type": "string", "description": "Nonblank after trim, maximum 200 characters after trim."}, "description": {"type": "string", "description": "Nonblank after trim."}, "category_id": {"$ref": "#/components/schemas/Id"}, "price": {"$ref": "#/components/schemas/Price"}}},
      "CoursePatch": {"type": "object", "additionalProperties": false, "properties": {"title": {"type": ["string", "null"], "description": "Null no-op; otherwise trimmed, nonblank and at most 200 characters."}, "description": {"type": ["string", "null"], "description": "Null no-op; otherwise trimmed and nonblank."}, "category_id": {"anyOf": [{"$ref": "#/components/schemas/Id"}, {"type": "null"}]}, "price": {"anyOf": [{"$ref": "#/components/schemas/Price"}, {"type": "null"}]}}},
      "Course": {"type": "object", "additionalProperties": false, "required": ["id", "title", "description", "category_id", "teacher_id", "price", "is_published", "archived_at", "thumbnail_url", "created_at", "updated_at", "category_name", "teacher_name", "lesson_count", "total_students"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "title": {"type": "string"}, "description": {"type": "string"}, "category_id": {"$ref": "#/components/schemas/Id"}, "teacher_id": {"$ref": "#/components/schemas/Id"}, "price": {"$ref": "#/components/schemas/Price"}, "is_published": {"type": "boolean"}, "archived_at": {"type": ["string", "null"], "format": "date-time", "pattern": "Z$"}, "thumbnail_url": {"type": ["string", "null"]}, "created_at": {"type": "string", "format": "date-time", "pattern": "Z$"}, "updated_at": {"type": "string", "format": "date-time", "pattern": "Z$"}, "category_name": {"type": "string"}, "teacher_name": {"type": "string"}, "lesson_count": {"type": "integer", "minimum": 0}, "total_students": {"type": "integer", "minimum": 0}}},
      "CategoryPage": {"type": "object", "additionalProperties": false, "required": ["items", "page", "page_size", "total"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/Category"}}, "page": {"type": "integer", "minimum": 1}, "page_size": {"type": "integer", "minimum": 1, "maximum": 100}, "total": {"type": "integer", "minimum": 0}}},
      "CoursePage": {"type": "object", "additionalProperties": false, "required": ["items", "page", "page_size", "total"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/Course"}}, "page": {"type": "integer", "minimum": 1}, "page_size": {"type": "integer", "minimum": 1, "maximum": 100}, "total": {"type": "integer", "minimum": 0}}},
      "LessonWrite": {"type": "object", "additionalProperties": false, "required": ["title"], "properties": {"title": {"type": "string", "description": "Trimmed nonblank title, at most 200 characters after trimming."}, "video_url": {"type": ["string", "null"], "maxLength": 2048, "description": "Empty/null clears video; nonempty value must be validated YouTube video URL."}, "transcript_text": {"type": ["string", "null"], "description": "Private manager text, trimmed; blank/null clears. At most 65535 UTF-8 bytes for existing TEXT column."}}},
      "Lesson": {"type": "object", "additionalProperties": false, "required": ["id", "course_id", "title", "video_url", "transcript_text", "order_index", "document_count", "quiz_count", "flashcard_count", "can_delete", "delete_blocked_reason", "created_at", "updated_at"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "course_id": {"$ref": "#/components/schemas/Id"}, "title": {"type": "string"}, "video_url": {"type": "string"}, "transcript_text": {"type": ["string", "null"], "description": "Always null for STUDENT."}, "order_index": {"type": "integer", "minimum": 0}, "document_count": {"type": "integer", "minimum": 0}, "quiz_count": {"type": "integer", "minimum": 0}, "flashcard_count": {"type": "integer", "minimum": 0}, "can_delete": {"type": "boolean"}, "delete_blocked_reason": {"type": ["string", "null"]}, "created_at": {"type": "string", "format": "date-time", "pattern": "Z$"}, "updated_at": {"type": "string", "format": "date-time", "pattern": "Z$"}}},
      "Login": {"type": "object", "additionalProperties": false, "required": ["email", "password"], "properties": {"email": {"type": "string", "minLength": 1, "maxLength": 254}, "password": {"type": "string", "minLength": 1, "maxLength": 72, "description": "Also limited to 72 UTF-8 bytes; no trimming, normalization or registration minimum."}}},
      "AuthResponse": {"type": "object", "additionalProperties": false, "required": ["access_token"], "properties": {"access_token": {"type": "string", "minLength": 1}}},
      "User": {"type": "object", "additionalProperties": false, "required": ["id", "full_name", "email", "role", "is_active", "created_at"], "properties": {"id": {"type": "string", "pattern": "^[1-9][0-9]*$"}, "full_name": {"type": "string"}, "email": {"type": "string"}, "role": {"type": "string", "enum": ["STUDENT", "TEACHER", "ADMIN"]}, "is_active": {"type": "boolean"}, "created_at": {"type": "string", "format": "date-time", "pattern": "Z$"}}},
      "Enrollment": {"type": "object", "additionalProperties": false, "required": ["course_id", "student_id", "enrolled_at"], "properties": {"course_id": {"$ref": "#/components/schemas/Id"}, "student_id": {"$ref": "#/components/schemas/Id"}, "enrolled_at": {"type": "string", "format": "date-time", "pattern": "Z$"}}},
      "CategorySummary": {"type": "object", "additionalProperties": false, "required": ["id", "name"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "name": {"type": "string"}}},
      "TeacherSummary": {"type": "object", "additionalProperties": false, "required": ["id", "full_name"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "full_name": {"type": "string"}}},
      "CourseEnrollment": {"type": "object", "additionalProperties": false, "required": ["id", "title", "description", "category", "teacher", "thumbnail_url", "price", "currency", "total_students", "lesson_count", "outline", "archived_at", "enrolled_at"], "properties": {"id": {"$ref": "#/components/schemas/Id"}, "title": {"type": "string"}, "description": {"type": "string"}, "category": {"$ref": "#/components/schemas/CategorySummary"}, "teacher": {"$ref": "#/components/schemas/TeacherSummary"}, "thumbnail_url": {"type": ["string", "null"]}, "price": {"$ref": "#/components/schemas/Price"}, "currency": {"type": "string"}, "total_students": {"type": "integer", "minimum": 0}, "lesson_count": {"type": "integer", "minimum": 0}, "outline": {"type": ["array", "null"], "items": {"type": "object"}}, "archived_at": {"type": ["string", "null"], "format": "date-time", "pattern": "Z$"}, "enrolled_at": {"type": "string", "format": "date-time", "pattern": "Z$"}}},
      "CourseEnrollmentPage": {"type": "object", "additionalProperties": false, "required": ["items", "page", "page_size", "total"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/CourseEnrollment"}}, "page": {"type": "integer", "minimum": 1}, "page_size": {"type": "integer", "minimum": 1, "maximum": 100}, "total": {"type": "integer", "minimum": 0}}},
      "Member": {"type": "object", "additionalProperties": false, "required": ["course_id", "student_id", "full_name", "enrolled_at"], "properties": {"course_id": {"$ref": "#/components/schemas/Id"}, "student_id": {"$ref": "#/components/schemas/Id"}, "full_name": {"type": "string"}, "enrolled_at": {"type": "string", "format": "date-time", "pattern": "Z$"}}},
      "MemberPage": {"type": "object", "additionalProperties": false, "required": ["items", "page", "page_size", "total"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/Member"}}, "page": {"type": "integer", "minimum": 1}, "page_size": {"type": "integer", "minimum": 1, "maximum": 100}, "total": {"type": "integer", "minimum": 0}}},
      "Error": {"type": "object", "additionalProperties": false, "required": ["code", "message", "details", "request_id"], "properties": {"code": {"type": "string", "description": "VALIDATION_ERROR, UNAUTHENTICATED, ACCOUNT_INACTIVE, EMAIL_NOT_VERIFIED, CONFIGURATION_ERROR, SERVICE_UNAVAILABLE or safe generic error."}, "message": {"type": "string"}, "details": {"type": "array", "items": {"type": "object", "additionalProperties": false, "required": ["field", "message"], "properties": {"field": {"type": "string"}, "message": {"type": "string"}}}}, "request_id": {"type": "string", "minLength": 1}}}
    },
    "responses": {
