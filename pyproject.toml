[project]
name = "learning-ai-system-python"
version = "0.1.0"
description = "FastAPI modular monolith skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.15.1",
    "pymysql[rsa]>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["mysql: opt-in real disposable MySQL integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
